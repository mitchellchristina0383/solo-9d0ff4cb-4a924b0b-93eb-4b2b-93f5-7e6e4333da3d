services:
  ci-scheduler:
    build: .
    container_name: ci-scheduler
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/snapshot')"]
      interval: 10s
      timeout: 3s
      retries: 5
